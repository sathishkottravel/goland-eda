# Live reload for running the api on the host: run `air` from backend/api.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ."
  entrypoint = ["./tmp/api.exe"]
  include_ext = ["go", "graphql", "yaml", "html"]
  exclude_dir = ["tmp"]
  delay = 500

[misc]
  clean_on_exit = true
