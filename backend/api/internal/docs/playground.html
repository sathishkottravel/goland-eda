<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>api – GraphQL Playground</title>
  <style>html, body, #sandbox { margin: 0; height: 100%; width: 100%; }</style>
</head>
<body>
  <div id="sandbox"></div>
  <script src="https://embeddable-sandbox.cdn.apollographql.com/_latest/embeddable-sandbox.umd.production.min.js"></script>
  <script>
    new window.EmbeddedSandbox({
      target: "#sandbox",
      initialEndpoint: location.origin + "/graphql",
      initialState: { document: 'query {\n  health\n  hello(name: "Sandbox")\n}\n' },
    });
  </script>
</body>
</html>
